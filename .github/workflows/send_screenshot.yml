name: Daily Screenshot Report

on:
  repository_dispatch:
    types: [send_screenshot]
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install puppeteer axios form-data

      - name: Run bot script
        env:
          # Replace this with the ACTUAL live URL of your new webpage
          SITE_URL: 'https://luharaadil.github.io/RN-RR-Management/'
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        # NOTE: Make sure this filename matches your script in Step 2
        run: node scripts/report.cjs
